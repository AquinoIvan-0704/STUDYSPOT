<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pending Requests - StudySpot Admin</title>
</head>
<body>
    <header>
        <h1>StudySpot Admin</h1>
        <nav>
            <a href="/studyspot">Home</a> | 
            <a href="/spots">Spots</a> | 
            <a href="/add-spot">Add Spot</a> | 
            <a href="/admin/pending">Review Requests</a> | 
            <a href="/about">About</a> | 
            <a href="/contact">Contact</a> | 
            <a href="/">Logout</a>
        </nav>
    </header>
    <main>
        <h2>Pending Spot Requests</h2>
        <div id="pending-list">Loading requests...</div>
    </main>

    <script>
        async function loadPendingSpots() {
            const response = await fetch('/api/pending-spots');
            const spots = await response.json();
            const container = document.getElementById('pending-list');
            
            if (spots.length === 0) {
                container.innerHTML = '<p>No pending requests right now.</p>';
                return;
            }

            let html = '<table border="1"><tr><th>Name</th><th>City</th><th>Seats</th><th>Wi-Fi</th><th>Noise</th><th>Action</th></tr>';
            spots.forEach(spot => {
                html += `<tr>
                    <td>${spot.name}</td>
                    <td>${spot.city}</td>
                    <td>${spot.seats}</td>
                    <td>${spot.wifi}</td>
                    <td>${spot.noise}</td>
                    <td>
                        <form action="/api/approve-spot/${spot.id}" method="POST" style="display:inline;">
                            <button type="submit">Approve & Add</button>
                        </form>
                    </td>
                </tr>`;
            });
            html += '</table>';
            container.innerHTML = html;
        }

        loadPendingSpots();
    </script>
</body>
</html>
