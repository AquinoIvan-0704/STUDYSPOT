<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Review Requests - StudySpot Admin</title>
</head>
<body>
    <header>
        <h1>StudySpot Admin</h1>
        <nav>
            <a href="/studyspot">Home</a> | 
            <a href="/spots">Spots</a> | 
            <a href="/add-spot">Add Spot</a> | 
            <a href="/admin/pending">Review Requests</a> | 
            <a href="/about">About</a> | 
            <a href="/contact">Contact</a> | 
            <a href="/">Logout</a>
        </nav>
    </header>
    <main>
        <h2>Pending Spot Requests</h2>
        <div id="pending-container"></div>
    </main>

    <script>
        fetch('/api/pending-spots')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('pending-container');
                if (data.length === 0) {
                    container.innerHTML = '<p>No pending spot requests.</p>';
                    return;
                }
                container.innerHTML = '';
                data.forEach(spot => {
                    container.innerHTML += `
                        <div>
                            <h3>${spot.name}</h3>
                            <p>City: ${spot.city} | Seats: ${spot.seats} | Wi-Fi: ${spot.wifi} | Noise: ${spot.noise}</p>
                            <form action="/api/approve-spot/${spot.id}" method="POST" style="display:inline;">
                                <button type="submit">Approve</button>
                            </form>
                            <form action="/api/decline-spot/${spot.id}" method="POST" style="display:inline;">
                                <button type="submit" onclick="return confirm('Are you sure you want to decline this request?');">Decline</button>
                            </form>
                            <hr>
                        </div>
                    `;
                });
            });
    </script>
</body>
</html>
