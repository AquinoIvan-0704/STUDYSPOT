<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Spots - StudySpot</title>
</head>
<body>
    <header>
        <h1>StudySpot</h1>
        <nav>
            <a href="/studyspot">Home</a> | 
            <a href="/spots">Spots</a> | 
            <a href="/add-spot">Add Spot</a> | 
            <a href="/about">About</a> | 
            <a href="/contact">Contact</a> | 
            <a href="/">Logout</a>
        </nav>
    </header>
    <main>
        <h2>All Study Spots</h2>
        <div id="all-spots-container"></div>
    </main>
    <script>
        fetch('/api/spots')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('all-spots-container');
                data.forEach(spot => {
                    container.innerHTML += `<div><h3>${spot.name}</h3><p>${spot.city}</p><p>${spot.seats} seats | ${spot.wifi} | ${spot.noise}</p><hr></div>`;
                });
            });
    </script>
</body>
</html>
