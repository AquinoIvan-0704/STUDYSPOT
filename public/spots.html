<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/style.css">
    <title>All Spots - StudySpot</title>
</head>
<body>
    <header>
        <h1>StudySpot</h1>
        <nav>
            <a href="/studyspot">Home</a> | 
            <a href="/spots">Spots</a> | 
            <a href="/add-spot">Add Spot</a> | 
            <a href="/about">About</a> | 
            <a href="/contact">Contact</a> | 
            <a href="/">Logout</a>
        </nav>
    </header>
    <main>
        <h2>All Study Spots</h2>
        <input type="text" id="searchInput" placeholder="Search by name or city..." style="margin-bottom: 20px; padding: 6px; width: 280px;">
        <div id="all-spots-container"></div>
    </main>
    <script>
        let currentUser = null;

        function renderSpots(data) {
            const container = document.getElementById('all-spots-container');
            if (!container) return;
            if (!data || data.length === 0) {
                container.innerHTML = '<p>No study spots found.</p>';
                return;
            }
            container.innerHTML = '';
            data.forEach(spot => {
                let adminControls = '';
                if (currentUser && currentUser.role === 'admin') {
                    adminControls = ` 
                        <a href="/edit-spot/${spot.id}">[Edit]</a>
                        <form action="/api/delete-spot/${spot.id}" method="POST" style="display:inline;">
                            <button type="submit" onclick="return confirm('Are you sure you want to delete this spot?');">[Delete]</button>
                        </form>
                    `;
                }
                container.innerHTML += `<div><h3>${spot.name || ''}${adminControls}</h3><p>${spot.city || ''}</p><p>${spot.seats || 0} seats | ${spot.wifi || ''} | ${spot.noise || ''}</p><hr></div>`;
            });
        }

        function fetchSpots(query = '') {
            const url = query ? `/api/search?q=${encodeURIComponent(query)}` : '/api/spots';
            fetch(url)
                .then(res => res.json())
                .then(data => renderSpots(data))
                .catch(err => console.error('Error fetching spots:', err));
        }

        fetch('/api/current-user')
            .then(res => res.json())
            .then(user => {
                currentUser = user; 
                if (user) {
                    const nav = document.querySelector('nav');
                    const links = document.querySelectorAll('nav a');
                    
                    links.forEach(link => {
                        const href = link.getAttribute('href');
                        if (href && href.includes('add-spot')) {
                            if (user.role !== 'admin') {
                                link.textContent = 'Request Spot';
                            }
                        }
                    });

                    if (user.role === 'admin' && nav) {
                        if (!document.getElementById('review-link')) {
                            nav.innerHTML += ` | <a href="/admin/pending" id="review-link">Review Requests</a>`;
                        }
                    }
                }

                const urlParams = new URLSearchParams(window.location.search);
                const queryParam = urlParams.get('q') || '';
                
                if (queryParam) {
                    const searchInput = document.getElementById('searchInput');
                    if (searchInput) {
                        searchInput.value = queryParam;
                    }
                }

                fetchSpots(queryParam);
            })
            .catch(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const queryParam = urlParams.get('q') || '';
                fetchSpots(queryParam);
            });

        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                fetchSpots(e.target.value);
            });
        }
    </script>
</body>
</html>
