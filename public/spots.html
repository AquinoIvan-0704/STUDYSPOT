<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>try{var t=localStorage.getItem('studyspot-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<title>All Study Spots — StudySpot</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/spots.css">
<script src="/js/ui.js" defer></script>
<script src="/js/spots.js" defer></script>
</head>
<body>

<header data-topbar="spots"></header>

<div class="page-head">
  <div class="shell">
    <div>
      <h1>All Study Spots</h1>
      <p>Browse every spot, read reviews, and share your own.</p>
    </div>
    <a class="btn btn-primary" id="addBtn" href="/add-spot">
      <svg class="icon icon-sm"><use href="#i-plus"/></svg> Add Spot
    </a>
  </div>
</div>

<main class="page-body">
  <div class="shell">

    <div class="list-toolbar">
      <div class="input-group">
        <svg class="icon icon-sm"><use href="#i-search"/></svg>
        <label class="sr-only" for="searchInput">Search spots</label>
        <input type="search" id="searchInput" placeholder="Search by name or city...">
      </div>

      <label class="sr-only" for="sortSelect">Sort spots</label>
      <select id="sortSelect" class="sort-select">
        <option value="rating">Highest rated</option>
        <option value="seats">Most seats</option>
        <option value="name">Name (A–Z)</option>
        <option value="newest">Newest first</option>
        <option value="reviews">Most reviewed</option>
      </select>

      <span class="count" id="resultCount"></span>
    </div>

    <div class="filter-bar" id="filterBar">
      <button type="button" class="filter-chip" data-filter="wifi">
        <svg class="icon icon-sm"><use href="#i-wifi"/></svg> Free Wi-Fi
      </button>
      <button type="button" class="filter-chip" data-filter="quiet">
        <svg class="icon icon-sm"><use href="#i-quiet"/></svg> Quiet Spaces
      </button>
      <button type="button" class="filter-chip" data-filter="seats">
        <svg class="icon icon-sm"><use href="#i-users"/></svg> Many Seats
      </button>
      <button type="button" class="filter-chip" data-filter="open">
        <svg class="icon icon-sm"><use href="#i-clock"/></svg> Open Now
      </button>
      <button type="button" class="btn btn-ghost btn-sm hidden" id="clearFilters">
        <svg class="icon icon-sm"><use href="#i-x"/></svg> Clear
      </button>
    </div>

    <div class="spot-rows" id="spotRows">
      <div class="skeleton" style="height:170px"></div>
      <div class="skeleton" style="height:170px"></div>
    </div>

    <div class="more-wrap">
      <button type="button" class="btn btn-ghost hidden" id="showMore"></button>
    </div>

  </div>
</main>

<footer data-footer></footer>
</body>
</html>
