<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Spots - StudySpot</title>
</head>
<body>
    <header>
        <h1>StudySpot</h1>
        <nav>
            <a href="/studyspot">Home</a> | 
            <a href="/spots">Spots</a> | 
            <a href="/add-spot">Add Spot</a> | 
            <a href="/about">About</a> | 
            <a href="/contact">Contact</a> | 
            <a href="/">Logout</a>
        </nav>
    </header>
    <main>
        <h2>All Study Spots</h2>
        <div id="all-spots-container"></div>
    </main>
    <script>
        // Check user role, update navbar, and fetch spots with admin edit controls
        fetch('/api/current-user')
            .then(res => res.json())
            .then(user => {
                if (user) {
                    const nav = document.querySelector('nav');
                    const links = document.querySelectorAll('nav a');
                    
                    links.forEach(link => {
                        if (link.getAttribute('href') && link.getAttribute('href').includes('add-spot')) {
                            if (user.role !== 'admin') {
                                link.textContent = 'Request Spot';
                            }
                        }
                    });

                    if (user.role === 'admin') {
                        if (!document.getElementById('review-link')) {
                            nav.innerHTML += ` | <a href="/admin/pending" id="review-link">Review Requests</a>`;
                        }
                    }
                }

                // Fetch and display all published spots (with admin edit option if applicable)
                return fetch('/api/spots')
                    .then(res => res.json())
                    .then(data => {
                        const container = document.getElementById('all-spots-container');
                        if (data.length === 0) {
                            container.innerHTML = '<p>No study spots available yet.</p>';
                            return;
                        }
                        container.innerHTML = '';
                        data.forEach(spot => {
                            let adminEditBtn = (user && user.role === 'admin') ? ` <a href="/edit-spot/${spot.id}">[Edit]</a>` : '';
                            container.innerHTML += `<div><h3>${spot.name}${adminEditBtn}</h3><p>${spot.city}</p><p>${spot.seats} seats | ${spot.wifi} | ${spot.noise}</p><hr></div>`;
                        });
                    });
            });
    </script>
</body>
</html>
