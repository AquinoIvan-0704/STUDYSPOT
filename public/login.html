<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>try{var t=localStorage.getItem('studyspot-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<title>Login or Register — StudySpot</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/auth.css">
<script src="/js/ui.js" defer></script>
<script type="module" src="/js/auth.js"></script>
</head>
<body class="auth">

<div class="auth-shell">

  <div class="auth-brand">
    <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
      <path d="M20 3.5c-6.35 0-11.5 5.15-11.5 11.5 0 8.6 11.5 21.5 11.5 21.5S31.5 23.6 31.5 15c0-6.35-5.15-11.5-11.5-11.5z"
            fill="none" stroke="#60a5fa" stroke-width="2.6"/>
      <path d="M13.8 11.4h4.3c1 0 1.9.8 1.9 1.9v7.4c0-1-.9-1.9-1.9-1.9h-4.3z" fill="#60a5fa"/>
      <path d="M26.2 11.4h-4.3c-1 0-1.9.8-1.9 1.9v7.4c0-1 .9-1.9 1.9-1.9h4.3z" fill="#60a5fa" opacity=".72"/>
    </svg>
    <div>
      <div class="brand-name">Study<span>Spot</span></div>
      <div class="brand-tag">Find. Study. Succeed.</div>
    </div>
  </div>

  <div class="auth-card" id="authCard">

    <!-- ---------- register ---------- -->
    <div class="auth-panel register">
      <form id="registerForm" novalidate>
        <h2>Create account</h2>
        <p class="sub">Join and start sharing study spots.</p>

        <button type="button" class="btn btn-google btn-block" data-google>
          <svg class="google-mark" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.2-.4-4.7H24v8.9h11.8c-.5 2.7-2 5-4.4 6.6v5.5h7.1c4.1-3.8 6.6-9.5 6.6-16.3z"/>
            <path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-7.1-5.5c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.5-3.8-12.2-9H4.5v5.7C8.1 41.2 15.5 46 24 46z"/>
            <path fill="#FBBC05" d="M11.8 28.3c-.4-1.3-.7-2.7-.7-4.3s.3-3 .7-4.3v-5.7H4.5C2.9 17.1 2 20.4 2 24s.9 6.9 2.5 10l7.3-5.7z"/>
            <path fill="#EA4335" d="M24 10.7c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.9 4.1 29.9 2 24 2 15.5 2 8.1 6.8 4.5 14l7.3 5.7c1.7-5.2 6.5-9 12.2-9z"/>
          </svg>
          Sign up with Google
        </button>
        <div class="auth-divider"><span>or</span></div>

        <div class="field">
          <div class="input-group">
            <svg class="icon icon-sm"><use href="#i-user"/></svg>
            <input type="text" id="reg-username" name="username" required minlength="3" maxlength="24"
                   autocomplete="nickname" placeholder="Display name">
          </div>
          <p class="field-error hidden" data-error-for="reg-username"></p>
        </div>

        <div class="field">
          <div class="input-group">
            <svg class="icon icon-sm"><use href="#i-mail"/></svg>
            <input type="email" id="reg-email" name="email" required
                   autocomplete="email" placeholder="Email address">
          </div>
          <p class="field-error hidden" data-error-for="reg-email"></p>
        </div>

        <div class="field">
          <div class="input-group">
            <svg class="icon icon-sm"><use href="#i-lock"/></svg>
            <input type="password" id="reg-password" name="password" required minlength="6"
                   autocomplete="new-password" placeholder="Password">
            <button type="button" class="reveal" data-reveal="reg-password" aria-label="Show password">
              <svg class="icon icon-sm"><use href="#i-eye"/></svg>
            </button>
          </div>
          <div class="strength" id="strength"><span></span><span></span><span></span></div>
          <p class="field-error hidden" data-error-for="reg-password"></p>
        </div>

        <div class="field">
          <div class="input-group">
            <svg class="icon icon-sm"><use href="#i-lock"/></svg>
            <input type="password" id="reg-confirm" name="confirm" required minlength="6"
                   autocomplete="new-password" placeholder="Confirm password">
          </div>
          <p class="field-error hidden" data-error-for="reg-confirm"></p>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="registerBtn">Register</button>
      </form>
    </div>

    <!-- ---------- login ---------- -->
    <div class="auth-panel login">
      <form id="loginForm" novalidate>
        <h2>Login</h2>
        <p class="sub">Sign in to review and add study spots.</p>

        <button type="button" class="btn btn-google btn-block" data-google>
          <svg class="google-mark" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.2-.4-4.7H24v8.9h11.8c-.5 2.7-2 5-4.4 6.6v5.5h7.1c4.1-3.8 6.6-9.5 6.6-16.3z"/>
            <path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-7.1-5.5c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.5-3.8-12.2-9H4.5v5.7C8.1 41.2 15.5 46 24 46z"/>
            <path fill="#FBBC05" d="M11.8 28.3c-.4-1.3-.7-2.7-.7-4.3s.3-3 .7-4.3v-5.7H4.5C2.9 17.1 2 20.4 2 24s.9 6.9 2.5 10l7.3-5.7z"/>
            <path fill="#EA4335" d="M24 10.7c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.9 4.1 29.9 2 24 2 15.5 2 8.1 6.8 4.5 14l7.3 5.7c1.7-5.2 6.5-9 12.2-9z"/>
          </svg>
          Continue with Google
        </button>
        <div class="auth-divider"><span>or</span></div>

        <div class="field">
          <div class="input-group">
            <svg class="icon icon-sm"><use href="#i-mail"/></svg>
            <input type="email" id="log-email" name="email" required
                   autocomplete="email" placeholder="Email address">
          </div>
          <p class="field-error hidden" data-error-for="log-email"></p>
        </div>

        <div class="field">
          <div class="input-group">
            <svg class="icon icon-sm"><use href="#i-lock"/></svg>
            <input type="password" id="log-password" name="password" required
                   autocomplete="current-password" placeholder="Password">
            <button type="button" class="reveal" data-reveal="log-password" aria-label="Show password">
              <svg class="icon icon-sm"><use href="#i-eye"/></svg>
            </button>
          </div>
          <p class="field-error hidden" data-error-for="log-password"></p>
        </div>

        <div class="auth-row">
          <label class="check"><input type="checkbox" id="remember" checked> Keep me signed in</label>
          <button type="button" class="link-btn" id="forgotBtn">Forgot password?</button>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Login</button>
      </form>
    </div>

    <!-- shared message area, sits above the panels -->
    <div id="authAlert" class="alert alert-error hidden" role="alert">
      <svg class="icon icon-sm"><use href="#i-alert"/></svg>
      <span id="authAlertText"></span>
    </div>
    <p class="auth-foot" id="authFoot"></p>

    <!-- ---------- sliding cover ---------- -->
    <div class="auth-cover parked-left" id="authCover"></div>

    <div class="auth-overlay for-login visible" id="overlayLogin">
      <h2>Hello, welcome</h2>
      <p>Don't have an account yet?</p>
      <button type="button" class="btn" id="toRegister">Register</button>
    </div>

    <div class="auth-overlay for-register" id="overlayRegister">
      <h2>Welcome back!</h2>
      <p>Already have an account?</p>
      <button type="button" class="btn" id="toLogin">Login</button>
    </div>

    <div class="auth-switch" id="switchStrip"></div>
  </div>

  <p class="auth-note">Browse without an account: <a href="/studyspot">go to StudySpot</a></p>
</div>

</body>
</html>
