<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
    <title>StudySpot - Login / Register</title>
</head>
<body>

    <div class="container" id="container">

        <div class="form-panel sign-up">
            <form action="/signup" method="POST">
                <h2>Registration</h2>
                <div class="input-box">
                    <input type="text" name="username" placeholder="Username" required>
                    <i class="fa-solid fa-user"></i>
                </div>
  
                <div class="input-box">
                    <input type="password" name="password" placeholder="Password" required>
                    <i class="fa-solid fa-lock"></i>
                </div>
                <button type="submit">Register</button>

                <div class="social-login">
                    <p>or register with social platforms</p>
                    <div class="social-buttons">
                        <a href="/auth/google" class="social-btn"><i class="fab fa-google"></i></a>
                        <a href="/auth/facebook" class="social-btn"><i class="fab fa-facebook-f"></i></a>
                        <a href="/auth/github" class="social-btn"><i class="fab fa-github"></i></a>
                        <a href="/auth/linkedin" class="social-btn"><i class="fab fa-linkedin-in"></i></a>
                    </div>
                </div>
            </form>
        </div>

      
        <div class="form-panel sign-in">
            <form action="/login" method="POST">
                <h2>Login</h2>
                <div class="input-box">
                    <input type="text" name="username" placeholder="Username" required>
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="input-box">
                    <input type="password" name="password" placeholder="Password" required>
                    <i class="fa-solid fa-lock"></i>
                </div>
                <button type="submit">Login</button>

                <div class="social-login">
                    <p>or login with social platforms</p>
                    <div class="social-buttons">
                        <a href="/auth/google" class="social-btn"><i class="fab fa-google"></i></a>
                        <a href="/auth/facebook" class="social-btn"><i class="fab fa-facebook-f"></i></a>
                        <a href="/auth/github" class="social-btn"><i class="fab fa-github"></i></a>
                        <a href="/auth/linkedin" class="social-btn"><i class="fab fa-linkedin-in"></i></a>
                    </div>
                </div>
            </form>
        </div>

        <div class="cover-panel parked-left" id="coverPanel"></div>

        <div class="overlay-text login-text visible" id="loginText">
            <h2>Hello, Welcome</h2>
            <p>Don't have an Account?</p>
            <button id="signUpBtn" type="button">Register</button>
        </div>

        <div class="overlay-text signup-text" id="signupText">
            <h2>Welcome Back!</h2>
            <p>Already have an Account?</p>
            <button id="signInBtn" type="button">Login</button>
        </div>

    </div>

    <script>
        const container = document.getElementById('container');
        const coverPanel = document.getElementById('coverPanel');
        const loginText = document.getElementById('loginText');
        const signupText = document.getElementById('signupText');
        const signUpBtn = document.getElementById('signUpBtn');
        const signInBtn = document.getElementById('signInBtn');

        let animating = false;
        const PHASE_MS = 600;

        function goToSignUp() {
            if (animating || container.classList.contains('right-panel-active')) return;
            animating = true;

            container.classList.add('right-panel-active');
            loginText.classList.remove('visible');
            coverPanel.classList.remove('parked-left');
            coverPanel.classList.add('covering');

            setTimeout(() => {
                coverPanel.classList.remove('covering');
                coverPanel.classList.add('parked-right');
                signupText.classList.add('visible');
                animating = false;
            }, PHASE_MS);
        }

        function goToSignIn() {
            if (animating || !container.classList.contains('right-panel-active')) return;
            animating = true;

            container.classList.remove('right-panel-active');
            signupText.classList.remove('visible');
            coverPanel.classList.remove('parked-right');
            coverPanel.classList.add('covering');

            setTimeout(() => {
                coverPanel.classList.remove('covering');
                coverPanel.classList.add('parked-left');
                loginText.classList.add('visible');
                animating = false;
            }, PHASE_MS);
        }

        signUpBtn.addEventListener('click', goToSignUp);
        signInBtn.addEventListener('click', goToSignIn);
    </script>
</body>
</html>
