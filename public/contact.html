<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact - StudySpot</title>
</head>
<body>
    <header>
        <h1>StudySpot</h1>
        <nav>
            <a href="/studyspot">Home</a> | 
            <a href="/spots">Spots</a> | 
            <a href="/add-spot">Add Spot</a> | 
            <a href="/about">About</a> | 
            <a href="/contact">Contact</a> | 
            <a href="/">Logout</a>
        </nav>
    </header>
    <main>
        <h2>Contact Us</h2>
        <p>Get in touch with us for any questions or support.</p>
    </main>
    <script>
    fetch('/api/current-user')
        .then(res => res.json())
        .then(user => {
            if (user && user.role !== 'admin') {
                const links = document.querySelectorAll('nav a');
                links.forEach(link => {
                    if (link.getAttribute('href') && link.getAttribute('href').includes('add-spot')) {
                        link.textContent = 'Request Spot';
                    }
                });
            }
        });
      
    fetch('/api/current-user')
        .then(res => res.json())
        .then(user => {
            if (user && user.role === 'admin') {
                const nav = document.querySelector('nav');
                if (nav && !document.getElementById('review-link')) {
                    nav.innerHTML += ` | <a href="/admin/pending" id="review-link">Review Requests</a>`;
                }
            }
        });
</script>
</script>
</body>
</html>
