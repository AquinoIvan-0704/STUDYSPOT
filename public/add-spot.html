<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/style.css">
    <title>Add Spot - StudySpot</title>
</head>
<body>
    <header>
        <h1>StudySpot</h1>
        <nav>
            <a href="/studyspot">Home</a> | 
            <a href="/spots">Spots</a> | 
            <a href="/add-spot">Add Spot</a> | 
            <a href="/about">About</a> | 
            <a href="/contact">Contact</a> | 
            <a href="/">Logout</a>
        </nav>
    </header>
    <main>
        <h2>Add a New Study Spot</h2>
        <form action="/api/spots" method="POST">
            <input type="text" name="name" placeholder="Spot Name" required><br><br>
            <input type="text" name="city" placeholder="City / Location" required><br><br>
            <input type="number" name="seats" placeholder="Seats Available" required><br><br>
            
            <select name="wifi" required>
                <option value="" disabled selected>Select Wi-Fi Status</option>
                <option value="Available">Available</option>
                <option value="No Wi-Fi">No Wi-Fi</option>
            </select><br><br>

            <select name="noise" required>
                <option value="" disabled selected>Select Noise Level</option>
                <option value="Quiet">Quiet</option>
                <option value="Moderate">Moderate</option>
                <option value="Loud">Loud</option>
            </select><br><br>

            <button type="submit">Submit Spot</button>
        </form>
    </main>
    <script>
    fetch('/api/current-user')
        .then(res => res.json())
        .then(user => {
            if (user && user.role === 'admin') {
                const nav = document.querySelector('nav');
                if (nav && !document.getElementById('review-link')) {
                    nav.innerHTML += ` | <a href="/admin/pending" id="review-link">Review Requests</a>`;
                }
            }
        });
</script>
</body>
</html>
